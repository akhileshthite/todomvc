name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # chel cannot fetch its own SQLite library (okTurtles/chel#150), so
      # scripts/chel.mjs points it at the system one. Usually already present.
      - name: Make sure the system SQLite library is there
        run: |
          if [ ! -f /usr/lib/x86_64-linux-gnu/libsqlite3.so.0 ]; then
            sudo apt-get update
            sudo apt-get install -y libsqlite3-0
          fi

      - run: npx playwright install --with-deps chromium

      - run: npm run lint

      - run: npm test

      # Builds the app and starts a relay on its own port and database.
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
